name: XAUUSD Signal Bot v9.1

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: xauusd-signal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir --quiet -r requirements.txt

      - name: Verify required files
        run: |
          MISSING=""
          for f in bot.py requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              MISSING="$MISSING $f"
            else
              echo "✅ $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ MISSING FILES:$MISSING"
            exit 1
          fi

      - name: Verify imports (Single-File Architecture)
        run: |
          python -c "
          import sys
          try:
              from bot import main, VERSION
              print(f'✅ Single-File Architecture OK | Version: {VERSION}')
          except Exception as e:
              print(f'❌ Import failed: {type(e).__name__}: {e}')
              sys.exit(1)
          "

      - name: Restore persistent cache (SQLite audit DB)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/quant_audit.db
          key: bot-cache-${{ github.run_id }}
          restore-keys: |
            bot-cache-

      - name: Run signal bot
        env:
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          ACCOUNT_SIZE_USD:     ${{ vars.ACCOUNT_SIZE_USD || '10000' }}
          XAUUSD_CONTRACT_SIZE: ${{ vars.XAUUSD_CONTRACT_SIZE || '100' }}
          RISK_PCT:             ${{ vars.RISK_PCT || '1.0' }}
          TRADING_MODE:         ${{ vars.TRADING_MODE || 'paper' }}
          DAILY_DD_PCT_LIMIT:   ${{ vars.DAILY_DD_PCT_LIMIT || '3.0' }}
          MAX_CONCURRENT_PER_DIRECTION: ${{ vars.MAX_CONCURRENT_PER_DIRECTION || '2' }}
          MAX_TOTAL_OPEN_RISK_PCT:      ${{ vars.MAX_TOTAL_OPEN_RISK_PCT || '3.0' }}
          NEWS_ENABLED:         ${{ vars.NEWS_ENABLED || '1' }}
        run: python bot.py

      - name: Save persistent cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/quant_audit.db
          key: bot-cache-${{ github.run_id }}
